[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voragon-realtime-cli"
version = "0.1.0"
description = "Minimal CLI test client for the Voragon realtime backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "sounddevice>=0.5.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
voragon-realtime = "realtime_cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["realtime_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
