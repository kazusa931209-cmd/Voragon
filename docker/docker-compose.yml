# Run from this directory: docker compose up --build
# Build context is the repository root (see realtime-backend/Dockerfile).
#
# Model cache: named volume voragon-model-cache persists Hugging Face Hub
# (faster-whisper ASR weights) and Torch hub caches (Silero VAD) across
# docker compose down / up. Use `docker compose down -v` to wipe the cache.

services:
  realtime-backend:
    build:
      context: ..
      dockerfile: docker/realtime-backend/Dockerfile
    image: voragon/realtime-backend:local
    ports:
      - "8000:8000"
    environment:
      ASR_MODEL: tiny
      LOG_FORMAT: json
      HF_HOME: /var/lib/voragon/model-cache/huggingface
      TORCH_HOME: /var/lib/voragon/model-cache/torch
    volumes:
      - voragon-model-cache:/var/lib/voragon/model-cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

volumes:
  voragon-model-cache:
